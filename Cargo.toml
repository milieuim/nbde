[package]
name = "nbde-agent"
version = "0.1.0"
edition = "2024"
resolver = "3"
license = "MIT"
description = "Policy-gated network-bound disk unlock agent for systemd initrd"

[lib]
name = "nbde"
path = "src/lib.rs"

[[bin]]
name = "nbde-agent"
path = "src/main.rs"

[dependencies]
rustix = { version = "1.1.6", features = ["mm", "process"] }
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
snafu = "0.9.2"
toml = { version = "1.2.1", default-features = false, features = ["parse", "serde"] }
zeroize = "1.9.1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
panic = "abort"

[dev-dependencies]
tempfile = "3.27.0"
